name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 1.2.3) — used when
          triggering manually without a git tag
        required: false
      skip-npm:
        description: Skip npm publish (e.g. already published)
        type: boolean
        default: false
      skip-mcp:
        description: Skip MCP Registry publish (e.g. already published)
        type: boolean
        default: false

jobs:
  npm:
    name: Publish to npm
    if: ${{ !inputs.skip-npm }}
    uses: codefuturist/shared-workflows/.github/workflows/release-npm.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      node-version: "24"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  goreleaser:
    name: GoReleaser (binaries + images)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # create the release / upload assets
      packages: write # push images to GHCR
      id-token: write # provenance attestation (sigstore)
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog + tag resolution need full history

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # Bun bundles from node_modules; install also applies the imapflow
      # patch (patches/) that Bun's stricter node:tls requires.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned to the version the binaries are qualified against locally;
      # bump deliberately, not via `latest`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Docker setup
        uses: codefuturist/shared-workflows/actions/docker-setup@v1
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dispatch runs re-release an existing tag from the current ref:
      # GORELEASER_CURRENT_TAG pins the version and --skip=validate waives
      # the tag-points-at-HEAD check. Tag pushes stay fully validated.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> 2.18"
          args: release --clean ${{ inputs.version && '--skip=validate' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/goreleaser/*.tar.gz
            build/goreleaser/*.zip

  mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [npm]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && !inputs.skip-mcp

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          ARCH="${ARCH/x86_64/amd64}"
          ARCH="${ARCH/aarch64/arm64}"
          BASE="https://github.com/modelcontextprotocol"
          BASE="${BASE}/registry/releases/latest/download"
          curl -L \
            "${BASE}/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher

      - name: Set version in server.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].version = $v
          ' server.json > server.tmp && mv server.tmp server.json

      # The registry validates the npm version exists; right after a publish
      # npm's CDN can lag a minute, so wait until the version resolves.
      - name: Wait for npm propagation
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
          for i in $(seq 1 30); do
            if npm view "@codefuturist/email-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "npm has $VERSION (after ${i}0s)"; exit 0
            fi
            sleep 10
          done
          echo "::error::@codefuturist/email-mcp@$VERSION not visible on npm after 5 minutes"
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

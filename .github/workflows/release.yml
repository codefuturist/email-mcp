name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 1.2.3) — used when
          triggering manually without a git tag
        required: false
      skip-npm:
        description: Skip npm publish (e.g. already published)
        type: boolean
        default: false
      skip-mcp:
        description: Skip MCP Registry publish (e.g. already published)
        type: boolean
        default: false

jobs:
  npm:
    name: Publish to npm
    if: ${{ !inputs.skip-npm }}
    uses: codefuturist/shared-workflows/.github/workflows/release-npm.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      node-version: "24"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # create the release / upload assets
      id-token: write # provenance attestation (sigstore)
      attestations: write

    steps:
      - name: Setup Node.js + pnpm
        uses: codefuturist/shared-workflows/actions/setup-node-pnpm@v1
        with:
          node-version: "24"

      # Pinned to the version the binaries are qualified against locally;
      # bump deliberately, not via `latest`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version"
            exit 1
          fi
          PKG="$(jq -r .version package.json)"
          if [[ "$PKG" != "$VERSION" ]]; then
            echo "::error::package.json version ($PKG) does not match release version ($VERSION)"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build standalone binaries
        run: ./scripts/build-binaries.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/release/*.tar.gz
            build/release/*.zip

      # Creates the GitHub release when this job gets there first; goreleaser
      # (docker job) appends to an existing release rather than fighting it.
      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" build/release/* --clobber

  mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [npm]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && !inputs.skip-mcp

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          ARCH="${ARCH/x86_64/amd64}"
          ARCH="${ARCH/aarch64/arm64}"
          BASE="https://github.com/modelcontextprotocol"
          BASE="${BASE}/registry/releases/latest/download"
          curl -L \
            "${BASE}/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher

      - name: Set version in server.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].version = $v
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [npm, mcp]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && needs.mcp.result == 'success'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docker setup
        uses: codefuturist/shared-workflows/actions/docker-setup@v1
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
